name: Build
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jobs:
          - {goos: linux, goarch: amd64, goamd64: v1}
          - {goos: android, goarch: arm64, ndk: aarch64-linux-android34}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Setup NDK
        if: ${{ matrix.jobs.goos == 'android' }}
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Set NDK env
        if: ${{ matrix.jobs.goos == 'android' }}
        run: |
          echo "CC=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.jobs.ndk }}-clang" >> $GITHUB_ENV

      - name: Build
        env:
          CGO_ENABLED: 1
          GOAMD64: "${{ matrix.jobs.goamd64 }}"
          GOARCH: "${{ matrix.jobs.goarch }}"
          GOOS: "${{ matrix.jobs.goos }}"
        run: |
          cd chaintest
          go build -o "ct-${{ matrix.jobs.goos }}-${{ matrix.jobs.goarch }}" \
            -buildvcs=false -trimpath -ldflags "-w -s -buildid="

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.jobs.goos }}-${{ matrix.jobs.goarch }}"
          path: chaintest/ct-${{ matrix.jobs.goos }}-${{ matrix.jobs.goarch }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
  release:
    permissions: write-all
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: bin/
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R
        working-directory: bin

      - name: Upload release
        uses: softprops/action-gh-release@v3
        if: ${{ success() }}
        with:
          files: bin/*
          make_latest: true
          tag_name: latest
